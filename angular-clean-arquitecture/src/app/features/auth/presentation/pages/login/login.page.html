<div class="mx-auto mt-16 w-full max-w-sm rounded-xl border border-gray-200 bg-white p-8 shadow-sm">
  <h1 class="mb-1 text-2xl font-bold text-gray-900">Iniciar sesión</h1>
  <p class="mb-6 text-sm text-gray-500">
    Demo con DummyJSON — usa <code class="rounded bg-gray-100 px-1">emilys</code> /
    <code class="rounded bg-gray-100 px-1">emilyspass</code>
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label for="username" class="mb-1 block text-sm font-medium text-gray-700">Usuario</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        autocomplete="username"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
      />
    </div>

    <div>
      <label for="password" class="mb-1 block text-sm font-medium text-gray-700">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
      />
    </div>

    @if (store.error(); as error) {
      <p role="alert" class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
    }

    <button
      type="submit"
      [disabled]="form.invalid || store.loading()"
      class="flex w-full items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50"
    >
      @if (store.loading()) {
        <app-spinner class="h-4 w-4" />
        Entrando…
      } @else {
        Entrar
      }
    </button>
  </form>
</div>
