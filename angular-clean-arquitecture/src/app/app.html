<div class="min-h-screen bg-gray-100">
  <header class="border-b border-gray-200 bg-white">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <a routerLink="/products" class="text-lg font-bold text-indigo-600">Mi Tienda</a>

      <div class="flex items-center gap-4 text-sm">
        <a
          routerLink="/products"
          routerLinkActive="text-indigo-600 font-semibold"
          class="text-gray-600 transition hover:text-indigo-600"
        >
          Productos
        </a>

        @if (authStore.isAuthenticated()) {
          <a
            routerLink="/profile"
            routerLinkActive="text-indigo-600 font-semibold"
            class="flex items-center gap-2 text-gray-600 transition hover:text-indigo-600"
          >
            @if (authStore.user(); as user) {
              <img [src]="user.image" [alt]="user.username" class="h-6 w-6 rounded-full" />
              {{ user.firstName }}
            } @else {
              Perfil
            }
          </a>
          <button
            type="button"
            (click)="authStore.logout()"
            class="rounded-lg border border-gray-300 px-3 py-1.5 text-gray-600 transition hover:bg-gray-50"
          >
            Salir
          </button>
        } @else {
          <a
            routerLink="/login"
            routerLinkActive="bg-indigo-700"
            class="rounded-lg bg-indigo-600 px-3 py-1.5 font-semibold text-white transition hover:bg-indigo-700"
          >
            Iniciar sesión
          </a>
        }
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8">
    <router-outlet />
  </main>
</div>
